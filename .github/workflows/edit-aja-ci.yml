name: Edit Aja Gemini Foundation CI

on:
  push:
    branches:
      - main
      - edit-aja-gemini-foundation
      - edit-aja-local-command-router
  pull_request:

permissions:
  contents: read

jobs:
  gemini-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Run Edit Aja tests
        run: |
          pytest -q \
            tests/agent/test_gemini_free_tier_gate.py \
            tests/hermes_cli/test_edit_aja_gemini_mode.py \
            tests/gateway/test_edit_aja_local_router.py \
            tests/gateway/test_display_config.py \
            tests/gateway/test_verbose_command.py \
            tests/gateway/test_busy_session_ack.py \
            tests/hermes_cli/test_desktop_slash_registry.py

      - name: Parse Windows setup scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/configure-edit-aja-gemini.ps1 -Raw)) | Out-Null
          $bootstrap = Get-Content scripts/install-edit-aja-windows.ps1 -Raw
          [scriptblock]::Create($bootstrap) | Out-Null
          $directInvoke = @($bootstrap -split "\n" | Where-Object { $_.Trim() -eq '& $geminiSetup' })
          if ($directInvoke.Count -gt 0) {
            throw "Bootstrap executes configure-edit-aja-gemini.ps1 directly and can be blocked by Windows ExecutionPolicy."
          }
          if (-not $bootstrap.Contains('[scriptblock]::Create($geminiSetupText)')) {
            throw "Bootstrap must invoke the Gemini setup from an in-memory ScriptBlock."
          }
          Write-Host "PowerShell syntax and execution-policy-safe invocation OK"
