name: Edit Aja Gemini Foundation CI

on:
  push:
    branches:
      - main
      - edit-aja-gemini-foundation
  pull_request:

permissions:
  contents: read

jobs:
  gemini-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run Edit Aja Gemini tests
        run: |
          pytest -q             tests/agent/test_gemini_free_tier_gate.py             tests/hermes_cli/test_edit_aja_gemini_mode.py

      - name: Parse Windows setup scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/configure-edit-aja-gemini.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content scripts/install-edit-aja-windows.ps1 -Raw)) | Out-Null
          Write-Host "PowerShell syntax OK"
