name: Edit Aja Free Cloud CI

on:
  push:
    branches:
      - main
      - edit-aja-cerebras-free-cloud
      - edit-aja-free-cloud-hardening
      - edit-aja-local-command-router
  pull_request:

permissions:
  contents: read

jobs:
  free-cloud-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Run Edit Aja tests
        run: |
          pytest -q \
            tests/hermes_cli/test_edit_aja_free_cloud_mode.py \
            tests/hermes_cli/test_edit_aja_free_cloud_runtime.py \
            tests/gateway/test_edit_aja_local_router.py \
            tests/gateway/test_display_config.py \
            tests/gateway/test_verbose_command.py \
            tests/gateway/test_busy_session_ack.py \
            tests/hermes_cli/test_desktop_slash_registry.py

      - name: Parse Windows setup scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/configure-edit-aja-free-cloud.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content scripts/configure-edit-aja-gemini.ps1 -Raw)) | Out-Null

          $bootstrap = Get-Content scripts/install-edit-aja-windows.ps1 -Raw
          [scriptblock]::Create($bootstrap) | Out-Null

          if ($bootstrap.Contains('configure-edit-aja-gemini.ps1')) {
            throw "Windows bootstrap must not configure Gemini."
          }
          if (-not $bootstrap.Contains('configure-edit-aja-free-cloud.ps1')) {
            throw "Windows bootstrap must invoke the free-cloud setup helper."
          }
          if (-not $bootstrap.Contains('[scriptblock]::Create($aiSetupText)')) {
            throw "Bootstrap must invoke free-cloud setup from an in-memory ScriptBlock."
          }

          $legacy = Get-Content scripts/configure-edit-aja-gemini.ps1 -Raw
          if ($legacy.Contains('auth add gemini')) {
            throw "Legacy compatibility wrapper must never add Gemini credentials."
          }

          $freeCloud = Get-Content scripts/configure-edit-aja-free-cloud.ps1 -Raw
          if (-not $freeCloud.Contains('$providersToList = @("cerebras")')) {
            throw "Free-cloud setup must build its credential-pool status list from configured providers."
          }
          if (-not $freeCloud.Contains('$providersToList += "cloudflare"')) {
            throw "Free-cloud setup must include Cloudflare status only when Cloudflare is configured."
          }

          Write-Host "PowerShell syntax and non-Gemini bootstrap checks OK"
